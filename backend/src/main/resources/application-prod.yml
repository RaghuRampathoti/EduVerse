spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://ep-delicate-tree-azx8ebhs-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:neondb_owner}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:npg_w5nCFSWNq7lG}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
